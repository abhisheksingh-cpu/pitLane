<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">

<title>Pit Lane Portfolio</title>
<style>
:root{--red:#e10600;--ink:#f4f4f6;--mut:#a3a3b0;--pan:#14141bf0;color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:#1a1620;color:var(--ink);font:italic 600 17px/1.35 "Barlow Condensed","Arial Narrow","Roboto Condensed",Impact,system-ui,sans-serif;touch-action:none;-webkit-user-select:none;user-select:none}

.hud{position:fixed;z-index:5;pointer-events:none}
#brand{left:14px;top:calc(12px + env(safe-area-inset-top,0px));background:var(--pan);border-left:6px solid var(--red);padding:6px 14px 6px 10px;transform:skewX(-8deg)}
#brand b{display:block;font-size:24px;letter-spacing:.5px;text-transform:uppercase}
#brand span{color:var(--mut);font-size:15px}
#tools{left:14px;top:calc(86px + env(safe-area-inset-top,0px));display:flex;gap:8px;pointer-events:auto}
button,.btn{font:inherit;color:var(--ink);background:var(--pan);border:1px solid #ffffff30;border-bottom:3px solid var(--red);padding:5px 12px;cursor:pointer;text-decoration:none;display:inline-block}
button:hover,.btn:hover{background:var(--red)}
button:focus-visible,.btn:focus-visible{outline:2px solid #fff;outline-offset:2px}
#side{right:14px;top:calc(12px + env(safe-area-inset-top,0px));text-align:right}
#mm{width:150px;height:150px;border:2px solid #ffffff30;display:block;margin-left:auto}
#stat{background:var(--pan);padding:4px 10px;margin-top:6px;border-right:5px solid var(--red)}
#spdbox{right:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px));text-align:right;background:var(--pan);padding:6px 14px;min-width:130px;border-right:6px solid var(--red)}
#spd{font-size:46px;line-height:1;font-weight:800}

#panel.on{display:flex}
#panel .in{position:relative;width:min(640px,100%);max-height:86vh;overflow:auto;touch-action:pan-y;background:var(--pan);border-left:8px solid var(--red);padding:22px 26px 24px;animation:pop .22s ease-out}

#pb small,.k{color:var(--mut)}
.chips span{display:inline-block;margin:3px 5px 3px 0;padding:2px 10px;background:#ffffff14;border-bottom:2px solid var(--red)}
.lap{display:flex;gap:14px;padding:10px 0;border-top:1px solid #ffffff22}.lap>b{color:var(--red);min-width:62px;font-size:22px}

#touch{display:none}
@media (pointer:coarse){#touch{display:block}#help{display:none}#spdbox{bottom:calc(150px + env(safe-area-inset-bottom,0px))}}
#joy{position:fixed;left:22px;bottom:calc(26px + env(safe-area-inset-bottom,0px));width:120px;height:120px;border-radius:50%;background:#ffffff1c;border:2px solid #ffffff55;z-index:6;touch-action:none}

.lt{font-size:clamp(40px,10vw,84px);font-weight:900;letter-spacing:2px;border-left:10px solid var(--red);padding-left:14px}
#load p{margin:0;color:var(--mut)}.bar{width:min(260px,70vw);height:5px;background:#ffffff22}.bar u{display:block;height:100%;background:var(--red);animation:ld 1.2s ease-out forwards}

@keyframes gr{25%{transform:translate(-3%,2%)}50%{transform:translate(2%,-3%)}75%{transform:translate(-2%,-1%)}}

#grade{position:fixed;inset:0;z-index:3;pointer-events:none;mix-blend-mode:soft-light;background:linear-gradient(#6a2fa066,transparent 40%,#ff6a2a55)}

.gh{border-radius:50%;background:radial-gradient(circle,#ffb87a88,transparent 70%)}
#title{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);z-index:6;text-align:center;pointer-events:none;opacity:0;animation:tt 5s ease-out .6s forwards;text-shadow:0 2px 20px #000;width:100%}

#title span{display:block;font-size:clamp(16px,2.4vw,26px);letter-spacing:.5em;text-transform:uppercase;color:#ffb3ad}

#tools{flex-wrap:wrap;max-width:calc(100vw - 190px)}
#flash{position:fixed;inset:0;z-index:3;pointer-events:none;background:#dfe8ff;opacity:0}
#mpl{display:none;background:var(--pan);margin-top:6px;padding:4px 10px;border-right:5px solid #ffd400;font-size:15px;line-height:1.3}
input{font:inherit;color:var(--ink);background:#0008;border:1px solid #ffffff40;padding:5px 10px;width:11em;-webkit-user-select:text;user-select:text}
#lights{position:fixed;left:50%;top:20%;transform:translateX(-50%);z-index:6;display:none;gap:12px;pointer-events:none;background:var(--pan);padding:12px 16px;border-bottom:4px solid var(--red)}

#lights i.on{background:#ff1a1a;box-shadow:0 0 18px #ff1a1a}

#race{left:50%;top:calc(12px + env(safe-area-inset-top,0px));transform:translateX(-50%) skewX(-8deg);background:var(--pan);border-left:6px solid var(--red);padding:6px 16px;font-size:24px;display:none;white-space:nowrap}

#hcam{position:fixed;left:calc(14px + env(safe-area-inset-left,0px));bottom:calc(76px + env(safe-area-inset-bottom,0px));width:128px;height:96px;z-index:6;border:3px solid #ffffff55;border-radius:8px;display:none;transform:scaleX(-1);pointer-events:none;background:#000}
#hst{left:calc(14px + env(safe-area-inset-left,0px));bottom:calc(178px + env(safe-area-inset-bottom,0px));transform:none;background:var(--pan);padding:3px 8px;font-size:13px;display:none;max-width:200px}
</style></head><body>
<canvas id="c"></canvas>
<div id="sunglow"></div><div id="streak"></div><div class="gh"></div><div class="gh"></div><div class="gh"></div><div id="grade"></div><div id="speedfx"></div><div id="title"><b id="tb"></b><span id="ts"></span></div><div id="flash"></div><div class="hud" id="hst"></div><canvas id="hcam" width="128" height="96"></canvas><div id="lights"></div><div class="hud" id="pit"></div><div class="hud" id="race"></div><div id="vig"></div><div id="grain"></div><div class="lbx" id="lb1"></div><div class="lbx" id="lb2"></div>

<div class="hud" id="side"><canvas id="mm" width="300" height="300"></canvas><div id="stat"></div></div>

<div id="load"><div class="lt">PIT LANE</div><p>Warming up the tyres…</p><div class="bar"><u></u></div></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>

};
const P=PORTFOLIO,$=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

$("#bn").textContent=P.name;$("#br").textContent=P.role;$("#tb").textContent=P.name;$("#ts").textContent=P.role;

/* ============ 2. SCENE ============ */
const renderer=new THREE.WebGLRenderer({canvas:$("#c"),antialias:true});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;
renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.toneMappingExposure=1.15;
const scene=new THREE.Scene();
const cam=new THREE.PerspectiveCamera(60,1,.5,420);
function tex(w,h,fn){const c=document.createElement("canvas");c.width=w;c.height=h;fn(c.getContext("2d"),w,h);const t=new THREE.CanvasTexture(c);t.anisotropy=4;return t}
scene.background=new THREE.Color(0xe88a64);
scene.fog=new THREE.Fog(0xe88a64,70,230);
/* sky dome: gradient + clouds + stars, one texture per time of day */
const TODS=[
{n:"Sunset",st:[[0,"#26336e"],[.38,"#b0609a"],[.5,"#f08a62"],[.58,"#ffd29a"],[1,"#f0b48a"]],cl:"255,190,150",fog:0xe88a64,hm:[0xffb98c,0x6a3fa8,1.05],am:[0x7a3fc0,.28],sn:[0xff9a58,1.35],ex:1.15,glow:1,gr:"linear-gradient(#6a2fa066,transparent 40%,#ff6a2a55)",vg:"#2a0a40a0",mt:0x7a4a8a,lk:0x7a5a9a},
{n:"Day",st:[[0,"#2f6fd6"],[.4,"#6fb0f0"],[.5,"#bfe0ff"],[.58,"#e6f3ff"],[1,"#cfe6f5"]],cl:"255,255,255",fog:0xbcd8ee,hm:[0xdfeeff,0x8a6a5a,1.25],am:[0xffffff,.35],sn:[0xfff4dc,1.7],ex:1,glow:.55,gr:"linear-gradient(#ffffff00,transparent)",vg:"#00000040",mt:0x5f84b0,lk:0x4a90d0},
{n:"Night",st:[[0,"#02030c"],[.4,"#070b22"],[.5,"#121c44"],[.58,"#1c2a5a"],[1,"#101838"]],cl:"90,110,170",fog:0x0b1030,hm:[0x6a7ac8,0x1a1440,.9],am:[0x3a4a9a,.55],sn:[0x9fb4ff,.8],ex:1,glow:0,gr:"linear-gradient(#0a1a6a55,transparent 50%,#00000055)",vg:"#000010c0",mt:0x0a1030,lk:0x0a1840}];
const DTX=[];
function domeTex(i){return DTX[i]||(DTX[i]=tex(1024,512,(g,w,h)=>{const T=TODS[i],r=g.createLinearGradient(0,0,0,h);T.st.forEach(([p,c])=>r.addColorStop(p,c));g.fillStyle=r;g.fillRect(0,0,w,h);
 for(let n=0;n<46;n++){const x=Math.random()*w,y=h*(.28+Math.random()*.2),s=40+Math.random()*90;for(let j=0;j<6;j++){const q=g.createRadialGradient(x+j*s*.5,y+Math.random()*10,0,x+j*s*.5,y,s);q.addColorStop(0,"rgba("+T.cl+","+(i===2?.12:.3)+")");q.addColorStop(1,"rgba("+T.cl+",0)");g.fillStyle=q;g.fillRect(x-s,y-s,s*3+j*s,s*2)}}
 if(i===2){for(let n=0;n<420;n++){g.fillStyle="rgba(255,255,255,"+(.3+Math.random()*.7)+")";const z=Math.random()<.1?2:1;g.fillRect(Math.random()*w,Math.random()*h*.5,z,z)}
  const q=g.createRadialGradient(720,h*.2,0,720,h*.2,60);q.addColorStop(0,"rgba(255,255,255,1)");q.addColorStop(.2,"rgba(235,240,255,.95)");q.addColorStop(.3,"rgba(160,190,255,.25)");q.addColorStop(1,"rgba(160,190,255,0)");g.fillStyle=q;g.fillRect(600,h*.2-120,240,240)}}))}
const dome=new THREE.Mesh(new THREE.SphereGeometry(380,32,16),new THREE.MeshBasicMaterial({side:THREE.BackSide,fog:false,depthWrite:false,map:domeTex(0)}));
dome.renderOrder=-1;scene.add(dome);
const hemi=new THREE.HemisphereLight(0xffb98c,0x6a3fa8,1.05),amb=new THREE.AmbientLight(0x7a3fc0,.28);scene.add(hemi,amb);
const sun=new THREE.DirectionalLight(0xff9a58,1.35);sun.castShadow=true;sun.shadow.mapSize.set(2048,2048);
Object.assign(sun.shadow.camera,{left:-50,right:50,top:50,bottom:-50,near:1,far:200});sun.shadow.bias=-.0006;
scene.add(sun,sun.target);
const M=(c,o)=>new THREE.MeshLambertMaterial(Object.assign({color:c},o));
function box(w,h,d,c,x,y,z,p){const m=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),c.isMaterial?c:M(c));m.position.set(x||0,y||0,z||0);m.castShadow=m.receiveShadow=true;(p||scene).add(m);return m}
function label(w,h,lines,acc){return tex(w,h,(g)=>{g.fillStyle="#14141b";g.fillRect(0,0,w,h);g.fillStyle=acc||"#e10600";g.fillRect(0,0,14,h);g.textBaseline="top";
 const s0=Math.min(h*.22,(h-30)/(1.25*(1+.7*(lines.length-1)))),x0=34;let y=16;
 lines.forEach((l,i)=>{const s=i?s0*.7:s0;g.font="italic 700 "+s+"px 'Arial Narrow',Arial,sans-serif";g.fillStyle=i?"#d8d8e0":"#fff";g.fillText(l,x0,y,w-x0-16);y+=s*1.25})})}
function tag(text,x,y,z,col){const t=tex(512,96,(g,w)=>{g.fillStyle="rgba(15,15,20,.88)";g.fillRect(0,12,w,72);g.fillStyle=col;g.fillRect(0,12,12,72);g.fillStyle="#fff";g.font="italic 700 44px 'Arial Narrow',Arial,sans-serif";g.textBaseline="middle";g.fillText(text,30,50,w-46)});
 const s=new THREE.Sprite(new THREE.SpriteMaterial({map:t,depthWrite:false,fog:false}));s.scale.set(10,1.9,1);s.position.set(x,y,z);scene.add(s)}

/* ground + track */
const grassT=tex(512,512,(g,w,h)=>{const n=8,q=w/n;for(let y=0;y<n;y++)for(let x=0;x<n;x++){const v=Math.random();g.fillStyle="hsl("+(14+v*8)+","+(78+v*10)+"%,"+(52+v*7)+"%)";g.fillRect(x*q,y*q,q,q);g.fillStyle="rgba(120,30,90,.16)";g.fillRect(x*q,y*q,q,2);g.fillRect(x*q,y*q,2,q)}

const pts=[[0,-60],[50,-60],[88,-30],[82,22],[42,52],[-8,40],[-50,62],[-92,30],[-86,-22],[-46,-52]].map(p=>new THREE.Vector3(p[0],0,p[1]));

const N=240,W=7,S=[],T=[];
for(let i=0;i<N;i++){S.push(curve.getPointAt(i/N));T.push(curve.getTangentAt(i/N))}

 for(let i=0;i<=N;i++){const k=i%N,p=S[k],t=T[k],nx=-t.z,nz=t.x;pos.push(p.x+nx*o0,y,p.z+nz*o0,p.x+nx*o1,y,p.z+nz*o1);uv.push(0,i*uvs,1,i*uvs);if(i<N){const a=i*2;idx.push(a,a+1,a+2,a+1,a+3,a+2)}}
 const g=new THREE.BufferGeometry();g.setAttribute("position",new THREE.Float32BufferAttribute(pos,3));g.setAttribute("uv",new THREE.Float32BufferAttribute(uv,2));g.setIndex(idx);g.computeVertexNormals();
 const m=new THREE.Mesh(g,mat);m.receiveShadow=true;scene.add(m)}
const trkM=M(0x4a3a5e,{side:THREE.DoubleSide});ribbon(-W,W,.05,.1,trkM);
const kt=tex(16,64,(g)=>{g.fillStyle="#e10600";g.fillRect(0,0,16,32);g.fillStyle="#fff";g.fillRect(0,32,16,32)});kt.wrapT=THREE.RepeatWrapping;
